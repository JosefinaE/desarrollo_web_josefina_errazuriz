{% extends "base.html" %}
{% block content %}

<h2>Ultimos 5 miembros agregados: </h2>
<ul id="lista-miembros">
        {% for m in miembros %}
        <li>{{m.nombre}} — {{m.email}} ({{map_tipo_miembro[m.tipo]}}{{" " + m.departamento if m.departamento else "" }})</li>
        {% endfor %}
</ul>

{% endblock %}
